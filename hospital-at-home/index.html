<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Hospital at Home · Actimi</title>
<style>
/* Hospital at Home landing page for MEDICA 2026 (eliasactimi.github.io/medica/hospital-at-home/).
   #start = overview, #<partner-id> = partner page. Device setup guides stay at ../#<partner-id>. */
:root{--bg:#FBF6ED; --surface:#FFFFFF; --ink:#1F1636; --ink2:#3B2D5A; --ink3:#6A607A; --line:#E9DFCC; --orange:#FF8A47; --orange-text:#C2410C; --magenta:#E72166}
*{box-sizing:border-box}
html,body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust:100%}
.flame{height:4px; background:linear-gradient(90deg,#F29E54,#EC6263 50%,#E72166)}
.bar{position:sticky; top:0; z-index:5; background:rgba(251,246,237,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.wrap{max-width:760px; margin:0 auto; padding:0 16px}
.bar .wrap{display:flex; align-items:center; justify-content:space-between; height:56px}
.brand{display:flex; align-items:baseline; gap:10px; text-decoration:none; color:var(--ink)}
.brand b{font-weight:800; letter-spacing:.18em; font-size:15px}
.brand span{font-size:13px; color:var(--ink3)}
.ev{font-size:12px; font-weight:700; letter-spacing:.12em; color:var(--orange-text)}
main{padding:28px 0 56px}
section{margin:0 0 30px}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--orange-text)}
h1{font-size:clamp(32px,8vw,48px); line-height:1.05; letter-spacing:-.025em; margin:8px 0 6px; font-weight:800}
h1 em{font-style:normal; color:var(--orange-text)}
.sub{font-size:13px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--ink3); margin:0 0 14px}
.lead{font-size:18px; color:var(--ink2); margin:0; max-width:36em}
h2{font-size:22px; letter-spacing:-.01em; margin:0 0 14px}
.cta{display:flex; flex-direction:column; gap:8px; margin-top:22px; padding:18px; border-radius:16px; background:var(--ink); color:#FFF5E8}
.cta a.btn, .cta span.btn{display:block; text-align:center; padding:15px 18px; border-radius:12px; font-weight:800; font-size:17px; text-decoration:none; background:linear-gradient(90deg,#F29E54,#EC6263 55%,#E72166); color:#1F1636}
.cta span.btn{opacity:.55; cursor:default}
.cta small{color:#C4B3CC; font-size:13px; text-align:center}
.grid{display:grid; grid-template-columns:1fr; gap:12px}
@media (min-width:600px){ .grid{grid-template-columns:1fr 1fr} }
.tile{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px}
.tile b{display:block; font-size:16px; margin-bottom:4px}
.tile b i{font-style:normal; color:var(--orange-text); font-size:12px; letter-spacing:.12em; text-transform:uppercase; display:block; margin-bottom:4px}
.tile p{margin:0; color:var(--ink2); font-size:15px}
.trust{display:flex; flex-wrap:wrap; gap:8px}
.trust span{font-size:13px; font-weight:700; padding:6px 11px; border-radius:999px; background:var(--surface); border:1px solid var(--line)}
.partners{display:grid; grid-template-columns:1fr; gap:10px}
.partners a{display:flex; justify-content:space-between; align-items:center; gap:12px; text-decoration:none; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px}
.partners a span{font-size:14px; color:var(--ink3)}
.partners a::after{content:"→"; color:var(--orange-text); font-weight:800}
.back{display:inline-block; margin-bottom:14px; color:var(--orange-text); text-decoration:none; font-weight:700}
.foot{font-size:13px; color:var(--ink3); margin-top:26px}
.guide{display:flex; justify-content:space-between; align-items:center; gap:12px; text-decoration:none; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px}
.guide span{font-size:14px; color:var(--ink3)}
.guide::after{content:"→"; color:var(--orange-text); font-weight:800}
.how{counter-reset:h; display:grid; gap:10px}
.how div{counter-increment:h; display:grid; grid-template-columns:34px 1fr; gap:12px; align-items:start}
.how div::before{content:counter(h); width:30px; height:30px; border-radius:50%; background:var(--orange); color:#1F1636; font-weight:800; display:grid; place-items:center}
.how p{margin:3px 0 0; color:var(--ink2); font-size:15px}
.how b{color:var(--ink)}
.tag{font-size:20px; font-weight:800; letter-spacing:-.01em; color:var(--ink); margin:0 0 8px}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
.chips span{font-size:13px; font-weight:700; padding:6px 11px; border-radius:999px; background:var(--surface); border:1px solid var(--line); color:var(--ink2)}
.who{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--orange); border-radius:14px; padding:16px; margin:0; color:var(--ink2); font-size:16px}
</style>
</head>
<body>
<div class="flame"></div>
<header class="bar"><div class="wrap">
  <a class="brand" href="#start"><b>ACTIMI</b><span>Hospital at Home</span></a>
  <span class="ev">MEDICA 2026</span>
</div></header>
<main><div class="wrap" id="view"></div></main>
<script>
const DATA = {"devices": [{"id": "mio", "short": "MIO", "device": "MIO Blood Glucose Meter"}, {"id": "fora", "short": "ForaCare", "device": "FORA PO200 Pulsoximeter"}, {"id": "oxysmart", "short": "OXYSMART", "device": "OXYSMART Fingertip-Pulsoximeter"}, {"id": "andesfit", "short": "Andesfit", "device": "Andesfit ADF-B27"}, {"id": "aktivmed", "short": "aktivmed", "device": "GlucoCheck GOLD"}, {"id": "fora6duo", "short": "ForaCare", "device": "FORA 6 Duo"}, {"id": "sinocare", "short": "Sinocare", "device": "Sinocare Safe AQ Air"}, {"id": "bpb6", "short": "microlife", "device": "microlife BP B6 Connect"}, {"id": "ihealth", "short": "iHealth", "device": "iHealth Track"}, {"id": "pf200", "short": "microlife", "device": "microlife PF 200 BT"}, {"id": "jpd200s", "short": "AngelSounds", "device": "AngelSounds JPD-200S"}]};
/* Download links for the pre-configured partner apps. Leave null until the link exists:
   the button then shows "coming soon" instead of a dead link. */
const APP_LINKS = { mio:null, fora:null, oxysmart:null, andesfit:null, aktivmed:null, fora6duo:null, sinocare:null, bpb6:null, ihealth:null, pf200:null, jpd200s:null };

const BENEFITS = [
  ['Patients', 'Measure at home', 'Readings go from the device to the app via Bluetooth – no typing, no paper diary.'],
  ['Practitioners', 'See every patient at a glance', 'A practitioner dashboard shows the vital data of all assigned patients.'],
  ['Clinics', 'One clinic access', 'Clinics manage their practitioners and patients in their own dashboard.'],
  ['Families', 'Share with loved ones', 'Patients can share selected readings read-only with relatives or caregivers.'],
];
const HOW = [
  ['Measure', 'The patient measures at home with a connected device. The reading goes to the app via Bluetooth.'],
  ['Review', 'Practitioners see the new reading in their dashboard, together with the patient’s history.'],
  ['Act', 'The clinic team follows up early – a call, a visit or a therapy change – without the patient coming in.'],
];
/* Partner-specific copy. how = [Measure, Review, Act]; tiles = [Patients, Practitioners, Clinics, Families] as [title, text]. */
const PARTNER = {
  mio: {
    tagline: 'Blood glucose for everyday diabetes care',
    lead: 'Daily glucose readings from home – the rechargeable MIO meter sends every value straight to the care team. No logbook needed.',
    chips: ['Blood glucose', 'Rechargeable', 'Bluetooth'],
    who: 'People with type 2 diabetes who check their glucose regularly, and practices that want to see how therapy works between visits.',
    how: ['The patient measures glucose as usual. The MIO meter sends each value to the app via Bluetooth.',
          'The practice sees fasting and after-meal values as a trend – not as single numbers copied from a paper diary.',
          'If values drift, the team adjusts medication or lifestyle advice early – without waiting for the next quarterly visit.'],
    tiles: [['No more logbook', 'Rechargeable meter, automatic transfer – patients just measure.'],
            ['Trends instead of snapshots', 'See glucose values between visits and judge how the therapy is working.'],
            ['Structured diabetes care', 'Follow all diabetes patients of the clinic in one dashboard, across practitioners.'],
            ['Peace of mind', 'Relatives can see readings read-only – for example for older parents living alone.']]
  },
  fora: {
    tagline: 'Oxygen saturation after hospital discharge',
    lead: 'SpO₂ and pulse from home – so patients can leave hospital earlier and still stay in view of the care team.',
    chips: ['SpO₂', 'Pulse rate', 'Bluetooth'],
    who: 'Patients with COPD, after pneumonia or after surgery whose oxygen saturation should be checked in the days and weeks after discharge.',
    how: ['The patient slides a finger into the FORA PO200. SpO₂ and pulse go to the app via Bluetooth.',
          'The team sees saturation and pulse over several days, with the patient’s history alongside.',
          'If saturation drops, the team calls or visits early – before the patient has to come back to hospital.'],
    tiles: [['Home sooner', 'Leave hospital earlier with a simple finger check – several times a day if needed.'],
            ['Spot a decline early', 'Falling SpO₂ or a rising pulse is visible in the dashboard right away.'],
            ['Safer early discharge', 'Monitor discharged patients remotely and plan follow-up by need, not by routine.'],
            ['Know they’re okay', 'Relatives can follow the readings read-only during recovery.']]
  },
  oxysmart: {
    tagline: 'Simple fingertip checks for long-term monitoring',
    lead: 'A one-button fingertip check that fits into every day – SpO₂ and pulse go straight to the care team, for weeks or months.',
    chips: ['SpO₂', 'Pulse rate', 'One button'],
    who: 'Patients with chronic lung or heart disease, and people recovering from respiratory infections, who need regular oxygen checks at home over a longer time.',
    how: ['One button, one finger: the OXYSMART measures SpO₂ and pulse in seconds and sends them via Bluetooth.',
          'The team sees the long-term course and can compare every reading with the patient’s own usual values.',
          'A change from the usual pattern leads to a check-in call, a medication review or an earlier appointment.'],
    tiles: [['Easy enough for every day', 'Compact and simple to use – also for older patients.'],
            ['Personal baselines', 'Judge each reading against the patient’s own normal range, not only a textbook value.'],
            ['Scale to many patients', 'One dashboard for long-term monitoring across your whole patient group.'],
            ['Shared from afar', 'Caregivers see how their relative is doing, read-only.']]
  },
  andesfit: {
    tagline: 'Glucose monitoring in mg/dL or mmol/L',
    lead: 'Blood glucose from home in the unit your patients and teams are used to – mg/dL or mmol/L.',
    chips: ['Blood glucose', 'mg/dL · mmol/L', 'Bluetooth'],
    who: 'Diabetes programmes that work across sites or countries, where patients and care teams use different glucose units.',
    how: ['The patient measures with the Andesfit ADF-B27. The value goes to the app via Bluetooth together with its unit.',
          'The team sees all readings in one place, together with the patient’s history.',
          'The team adjusts therapy remotely and follows up only where it is needed.'],
    tiles: [['Familiar numbers', 'Readings in the unit patients know – nothing to convert in their head.'],
            ['No transcription errors', 'Every value arrives with its unit – nobody types numbers off a display.'],
            ['International programmes', 'Run remote glucose monitoring across sites and countries on one platform.'],
            ['Support at home', 'Family members can follow readings read-only and help with daily routines.']]
  },
  aktivmed: {
    tagline: 'Hygienic glucose testing for home and care services',
    lead: 'Glucose testing with hygienic strip ejection – made for home care, nursing services and care homes.',
    chips: ['Blood glucose', 'Strip eject button', 'Bluetooth'],
    who: 'Nursing services and care homes that measure glucose for their residents, and patients at home who are supported by a nurse.',
    how: ['The patient or nurse measures and ejects the used strip without touching it. The value goes to the app via Bluetooth.',
          'The doctor sees readings taken at home and by the care service in the same place.',
          'Doctor and care service coordinate on the same data – therapy changes without paper handovers or faxes.'],
    tiles: [['Measured, done', 'Values are transferred automatically – nothing to write down.'],
            ['One view with the care service', 'Readings taken by nursing staff appear in the same dashboard.'],
            ['Hygiene built in', 'Touch-free strip ejection supports hygienic routines for care staff.'],
            ['Informed relatives', 'Relatives can see readings read-only, even when they live far away.']]
  },
  fora6duo: {
    tagline: 'Glucose and β-ketone in one meter',
    lead: 'Glucose and β-ketone with one meter – so the care team sees ketones, not just sugar.',
    chips: ['Blood glucose', 'β-ketone', 'Bluetooth'],
    who: 'People with type 1 diabetes, insulin pump users and patients on SGLT2 inhibitors – where a ketone check helps to catch ketoacidosis early.',
    how: ['The patient measures glucose – and ketones with the β-ketone strip when glucose is high or they feel unwell.',
          'The team sees glucose and ketone values side by side in the dashboard.',
          'Rising ketones lead to an early call and the sick-day plan – before an emergency admission becomes necessary.'],
    tiles: [['One meter, two values', 'No second device for ketone checks.'],
            ['Ketones in context', 'Judge every ketone value next to glucose and the patient’s history.'],
            ['Sick days covered', 'Support patients remotely when they are ill – when the risk is highest.'],
            ['Extra safety for families', 'Parents of teenagers with type 1 diabetes can follow readings read-only.']]
  },
  sinocare: {
    tagline: 'No coding, tiny sample – easy glucose checks',
    lead: 'Glucose testing with no coding and a 0.6 µl sample – easy to start, easy to keep doing.',
    chips: ['Blood glucose', 'No coding', '0.6 µl sample'],
    who: 'Patients who are new to glucose self-testing and older patients – a simple routine makes regular readings much more likely.',
    how: ['Insert a strip, add a tiny drop of blood – no coding. The value goes to the app via Bluetooth.',
          'The team sees how values develop – and whether the patient measures regularly.',
          'If readings are missing or out of range, the team follows up with a call or an adjusted therapy.'],
    tiles: [['Simple from day one', 'No coding and a very small blood sample.'],
            ['See adherence', 'Notice when a patient stops measuring – not only what the values are.'],
            ['Easy onboarding', 'Fewer setup questions when new patients start home monitoring.'],
            ['Help at a distance', 'Family can follow readings read-only and give a gentle reminder.']]
  },
  bpb6: {
    tagline: 'Blood pressure with AFib screening',
    lead: 'Home blood pressure with triple measurement and AFib screening – home readings your care team can rely on.',
    chips: ['Blood pressure', 'Pulse', 'MAM · AFib screening'],
    who: 'Patients with high blood pressure or on blood pressure medication, and people with a higher stroke risk where atrial fibrillation should be found early.',
    how: ['In MAM mode the monitor measures three times in a row and screens for atrial fibrillation. Results go to the app via Bluetooth.',
          'The team sees home blood pressure over weeks – the real picture, not one reading at the practice.',
          'The team adjusts medication based on home values and arranges an ECG if atrial fibrillation is suspected.'],
    tiles: [['Reliable at home', 'Three measurements, one averaged result – less noise than a single reading.'],
            ['Beyond white-coat readings', 'Home values show how blood pressure really behaves in daily life.'],
            ['Stroke prevention', 'AFib screening during routine checks helps find patients who need further tests.'],
            ['Keep an eye on it', 'Relatives can follow blood pressure read-only.']]
  },
  ihealth: {
    tagline: 'Blood pressure with a clear colour indicator',
    lead: 'Blood pressure at a glance – the colour screen shows patients right away whether their reading is in range.',
    chips: ['Blood pressure', 'Pulse', 'WHO colour scale'],
    who: 'Older patients and people new to home blood pressure monitoring, who benefit from instant, easy-to-understand feedback.',
    how: ['The patient measures; the screen shows the WHO classification in green, yellow or red. Values go to the app via Bluetooth.',
          'The team sees all readings and their trend over time.',
          'Readings that stay high lead to a medication review – remotely, without an extra visit.'],
    tiles: [['Understand your reading', 'Green, yellow or red – no need to interpret numbers.'],
            ['Engaged patients', 'Instant feedback helps patients stick with their routine.'],
            ['Low barrier to start', 'An easy device for broad blood pressure programmes.'],
            ['Simple to share', 'Relatives see readings read-only and know when to check in.']]
  },
  pf200: {
    tagline: 'Peak flow and FEV1 for asthma and COPD',
    lead: 'Peak flow and FEV1 from home – see a worsening of asthma or COPD before it turns into an exacerbation.',
    chips: ['PEF', 'FEV1', 'Bluetooth'],
    who: 'Patients with asthma or COPD, and lung specialists who manage therapy with regular lung function readings.',
    how: ['The patient blows into the PF 200 BT. PEF and FEV1 go to the app via Bluetooth.',
          'The team sees lung function over time and can compare it with the patient’s personal best.',
          'A falling trend leads to an early therapy step-up, in line with the patient’s action plan.'],
    tiles: [['A quick daily check', 'One breath shows whether the lungs are stable.'],
            ['Lung function between visits', 'PEF and FEV1 over weeks instead of one spirometry at the practice.'],
            ['Act before exacerbations', 'Early signs of decline give the team time to adjust therapy.'],
            ['Support for parents', 'Parents of children with asthma can follow readings read-only.']]
  },
  jpd200s: {
    tagline: 'Fetal heart rate at home during pregnancy',
    lead: 'Fetal heart rate from home – shared with the midwife or gynaecologist, as an addition to regular check-ups.',
    chips: ['Fetal heart rate', 'Ultrasound Doppler', 'Bluetooth'],
    who: 'Expectant mothers in remote care programmes – for example with a long way to the practice – together with their midwife or gynaecologist.',
    how: ['With ultrasound gel and the probe, the mother finds the heartbeat. The fetal heart rate goes to the app via Bluetooth.',
          'The midwife or practice sees the readings with date and time.',
          'If something seems unusual, the team gets in touch and arranges a check-up. The Doppler never replaces CTG or prenatal care.'],
    tiles: [['Closer to your baby', 'Hear the heartbeat at home and share it with your care team.'],
            ['Context for every call', 'Recent readings are at hand when an expectant mother calls.'],
            ['Remote prenatal support', 'Add a home component to prenatal programmes – as an addition, not a replacement.'],
            ['Share the moment', 'Partners and family can see readings read-only.']]
  },
};
const TRUST = ['MDR Class IIa', 'ISO 13485', 'ISO 27001', 'GDPR', 'Hosted in Germany', 'HL7 FHIR R4'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const devName = d => d.device.replace('Pulsoximeter','Pulse Oximeter').replace('Blutzuckermessgerät','Blood Glucose Meter').replace('Fingertip-Pulse','Fingertip Pulse');

function benefits(d){
  const p = d && PARTNER[d.id];
  const how = p ? HOW.map((h,i)=>[h[0], p.how[i]]) : HOW;
  const tiles = p ? BENEFITS.map((b,i)=>[b[0], p.tiles[i][0], p.tiles[i][1]]) : BENEFITS;
  return `<section><h2>${p ? `How it works with the ${esc(devName(d))}` : 'How it works'}</h2><div class="how">${how.map(h=>`<div><p><b>${h[0]}.</b> ${esc(h[1])}</p></div>`).join('')}</div></section>
  <section><h2>${p ? `What ${esc(d.short)} × Actimi brings` : 'Why Hospital at Home'}</h2><div class="grid">${tiles.map(b=>`<div class="tile"><b><i>${b[0]}</i>${esc(b[1])}</b><p>${esc(b[2])}</p></div>`).join('')}</div></section>
  <section><h2>Certified and secure</h2><div class="trust">${TRUST.map(t=>`<span>${t}</span>`).join('')}</div></section>`;
}
function overview(){
  return `<section><div class="eyebrow">MEDICA 2026 · Düsseldorf · Hall 17, Booth B22</div>
    <h1>Hospital at Home <em>by Actimi</em></h1>
    <p class="lead">Your patients measure at home. Practitioners and clinics see the readings in real time – on one certified platform.</p></section>
  ${benefits()}
  <section><h2>Our partners at MEDICA</h2><div class="partners">${DATA.devices.map(d=>`<a href="#${d.id}"><div><strong>${esc(d.short)} × Actimi</strong><br><span>${esc(devName(d))} · ${esc(PARTNER[d.id].tagline)}</span></div></a>`).join('')}</div></section>
  <p class="foot">Actimi GmbH · Stuttgart · <a href="https://actimi.com" style="color:inherit">actimi.com</a></p>`;
}
function partner(d){
  const p = PARTNER[d.id], app = `${d.short} Hospital at Home app`, link = APP_LINKS[d.id];
  const btn = link ? `<a class="btn" href="${esc(link)}">Download the ${esc(app)}</a><small>For iPhone and Android</small>`
                   : `<span class="btn" aria-disabled="true">Download the ${esc(app)}</span><small>Download link coming soon – ask us at MEDICA, Hall 17, Booth B22.</small>`;
  return `<a class="back" href="#start">← Hospital at Home</a>
  <section><div class="eyebrow">MEDICA 2026</div><h1>${esc(d.short)} <em>× Actimi</em></h1><p class="sub">Hospital at Home</p>
    <p class="tag">${esc(p.tagline)}</p>
    <p class="lead">${esc(p.lead)}</p>
    <div class="chips"><span>${esc(devName(d))}</span>${p.chips.map(c=>`<span>${esc(c)}</span>`).join('')}</div>
    <div class="cta">${btn}</div></section>
  <section><h2>Who it’s for</h2><p class="who">${esc(p.who)}</p></section>
  ${benefits(d)}
  <section><h2>Set up your device</h2><a class="guide" href="../#${d.id}"><div><strong>${esc(devName(d))} – setup guide</strong><br><span>Video and 6 steps: pairing, measuring, sending readings</span></div></a></section>
  <p class="foot">Demo for MEDICA 2026. Always follow the manufacturer’s instructions for use. Actimi GmbH · <a href="https://actimi.com" style="color:inherit">actimi.com</a></p>`;
}
function render(){
  const d = DATA.devices.find(x => x.id === (location.hash||'').slice(1));
  document.getElementById('view').innerHTML = d ? partner(d) : overview();
  document.title = d ? `${d.short} × Actimi · Hospital at Home` : 'Hospital at Home · Actimi';
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0,0); });
render();
</script>
</body>
</html>
