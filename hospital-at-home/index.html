<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Hospital at Home · Actimi</title>
<style>
/* Hospital at Home landing page for MEDICA 2026 (eliasactimi.github.io/medica/hospital-at-home/).
   #start = overview, #<partner-id> = partner page. Device setup guides stay at ../#<partner-id>. */
:root{--bg:#FBF6ED; --surface:#FFFFFF; --ink:#1F1636; --ink2:#3B2D5A; --ink3:#6A607A; --line:#E9DFCC; --orange:#FF8A47; --orange-text:#C2410C; --magenta:#E72166}
*{box-sizing:border-box}
html,body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust:100%}
.flame{height:4px; background:linear-gradient(90deg,#F29E54,#EC6263 50%,#E72166)}
.bar{position:sticky; top:0; z-index:5; background:rgba(251,246,237,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.wrap{max-width:760px; margin:0 auto; padding:0 16px}
.bar .wrap{display:flex; align-items:center; justify-content:space-between; height:56px}
.brand{display:flex; align-items:baseline; gap:10px; text-decoration:none; color:var(--ink)}
.brand b{font-weight:800; letter-spacing:.18em; font-size:15px}
.brand span{font-size:13px; color:var(--ink3)}
.ev{font-size:12px; font-weight:700; letter-spacing:.12em; color:var(--orange-text)}
main{padding:28px 0 56px}
section{margin:0 0 30px}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--orange-text)}
h1{font-size:clamp(32px,8vw,48px); line-height:1.05; letter-spacing:-.025em; margin:8px 0 6px; font-weight:800}
h1 em{font-style:normal; color:var(--orange-text)}
.sub{font-size:13px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--ink3); margin:0 0 14px}
.lead{font-size:18px; color:var(--ink2); margin:0; max-width:36em}
h2{font-size:22px; letter-spacing:-.01em; margin:0 0 14px}
.cta{display:flex; flex-direction:column; gap:8px; margin-top:22px; padding:18px; border-radius:16px; background:var(--ink); color:#FFF5E8}
.cta a.btn, .cta span.btn{display:block; text-align:center; padding:15px 18px; border-radius:12px; font-weight:800; font-size:17px; text-decoration:none; background:linear-gradient(90deg,#F29E54,#EC6263 55%,#E72166); color:#1F1636}
.cta span.btn{opacity:.55; cursor:default}
.cta small{color:#C4B3CC; font-size:13px; text-align:center}
.grid{display:grid; grid-template-columns:1fr; gap:12px}
@media (min-width:600px){ .grid{grid-template-columns:1fr 1fr} }
.tile{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px}
.tile b{display:block; font-size:16px; margin-bottom:4px}
.tile b i{font-style:normal; color:var(--orange-text); font-size:12px; letter-spacing:.12em; text-transform:uppercase; display:block; margin-bottom:4px}
.tile p{margin:0; color:var(--ink2); font-size:15px}
.trust{display:flex; flex-wrap:wrap; gap:8px}
.trust span{font-size:13px; font-weight:700; padding:6px 11px; border-radius:999px; background:var(--surface); border:1px solid var(--line)}
.partners{display:grid; grid-template-columns:1fr; gap:10px}
.partners a{display:flex; justify-content:space-between; align-items:center; gap:12px; text-decoration:none; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px}
.partners a span{font-size:14px; color:var(--ink3)}
.partners a::after{content:"→"; color:var(--orange-text); font-weight:800}
.back{display:inline-block; margin-bottom:14px; color:var(--orange-text); text-decoration:none; font-weight:700}
.foot{font-size:13px; color:var(--ink3); margin-top:26px}
.guide{display:flex; justify-content:space-between; align-items:center; gap:12px; text-decoration:none; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px}
.guide span{font-size:14px; color:var(--ink3)}
.guide::after{content:"→"; color:var(--orange-text); font-weight:800}
.how{counter-reset:h; display:grid; gap:10px}
.how div{counter-increment:h; display:grid; grid-template-columns:34px 1fr; gap:12px; align-items:start}
.how div::before{content:counter(h); width:30px; height:30px; border-radius:50%; background:var(--orange); color:#1F1636; font-weight:800; display:grid; place-items:center}
.how p{margin:3px 0 0; color:var(--ink2); font-size:15px}
.how b{color:var(--ink)}
</style>
</head>
<body>
<div class="flame"></div>
<header class="bar"><div class="wrap">
  <a class="brand" href="#start"><b>ACTIMI</b><span>Hospital at Home</span></a>
  <span class="ev">MEDICA 2026</span>
</div></header>
<main><div class="wrap" id="view"></div></main>
<script>
const DATA = {"devices": [{"id": "mio", "short": "MIO", "device": "MIO Blood Glucose Meter"}, {"id": "fora", "short": "ForaCare", "device": "FORA PO200 Pulsoximeter"}, {"id": "oxysmart", "short": "OXYSMART", "device": "OXYSMART Fingertip-Pulsoximeter"}, {"id": "andesfit", "short": "Andesfit", "device": "Andesfit ADF-B27"}, {"id": "aktivmed", "short": "aktivmed", "device": "GlucoCheck GOLD"}, {"id": "fora6duo", "short": "ForaCare", "device": "FORA 6 Duo"}, {"id": "sinocare", "short": "Sinocare", "device": "Sinocare Safe AQ Air"}, {"id": "bpb6", "short": "microlife", "device": "microlife BP B6 Connect"}, {"id": "ihealth", "short": "iHealth", "device": "iHealth Track"}, {"id": "pf200", "short": "microlife", "device": "microlife PF 200 BT"}, {"id": "jpd200s", "short": "AngelSounds", "device": "AngelSounds JPD-200S"}]};
/* Download links for the pre-configured partner apps. Leave null until the link exists:
   the button then shows "coming soon" instead of a dead link. */
const APP_LINKS = { mio:null, fora:null, oxysmart:null, andesfit:null, aktivmed:null, fora6duo:null, sinocare:null, bpb6:null, ihealth:null, pf200:null, jpd200s:null };

const BENEFITS = [
  ['Patients', 'Measure at home', 'Readings go from the device to the app via Bluetooth – no typing, no paper diary.'],
  ['Practitioners', 'See every patient at a glance', 'A practitioner dashboard shows the vital data of all assigned patients.'],
  ['Clinics', 'One clinic access', 'Clinics manage their practitioners and patients in their own dashboard.'],
  ['Families', 'Share with loved ones', 'Patients can share selected readings read-only with relatives or caregivers.'],
];
const HOW = [
  ['Measure', 'The patient measures at home with a connected device. The reading goes to the app via Bluetooth.'],
  ['Review', 'Practitioners see the new reading in their dashboard, together with the patient’s history.'],
  ['Act', 'The clinic team follows up early – a call, a visit or a therapy change – without the patient coming in.'],
];
const TRUST = ['MDR Class IIa', 'ISO 13485', 'ISO 27001', 'GDPR', 'Hosted in Germany', 'HL7 FHIR R4'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const devName = d => d.device.replace('Pulsoximeter','Pulse Oximeter').replace('Blutzuckermessgerät','Blood Glucose Meter').replace('Fingertip-Pulse','Fingertip Pulse');

function benefits(){
  return `<section><h2>How it works</h2><div class="how">${HOW.map(h=>`<div><p><b>${h[0]}.</b> ${h[1]}</p></div>`).join('')}</div></section>
  <section><h2>Why Hospital at Home</h2><div class="grid">${BENEFITS.map(b=>`<div class="tile"><b><i>${b[0]}</i>${b[1]}</b><p>${b[2]}</p></div>`).join('')}</div></section>
  <section><h2>Certified and secure</h2><div class="trust">${TRUST.map(t=>`<span>${t}</span>`).join('')}</div></section>`;
}
function overview(){
  return `<section><div class="eyebrow">MEDICA 2026 · Düsseldorf · Hall 17, Booth B22</div>
    <h1>Hospital at Home <em>by Actimi</em></h1>
    <p class="lead">Your patients measure at home. Practitioners and clinics see the readings in real time – on one certified platform.</p></section>
  ${benefits()}
  <section><h2>Our partners at MEDICA</h2><div class="partners">${DATA.devices.map(d=>`<a href="#${d.id}"><div><strong>${esc(d.short)} × Actimi</strong><br><span>${esc(devName(d))}</span></div></a>`).join('')}</div></section>
  <p class="foot">Actimi GmbH · Stuttgart · <a href="https://actimi.com" style="color:inherit">actimi.com</a></p>`;
}
function partner(d){
  const app = `${d.short} Hospital at Home app`, link = APP_LINKS[d.id];
  const btn = link ? `<a class="btn" href="${esc(link)}">Download the ${esc(app)}</a><small>For iPhone and Android</small>`
                   : `<span class="btn" aria-disabled="true">Download the ${esc(app)}</span><small>Download link coming soon – ask us at MEDICA, Hall 17, Booth B22.</small>`;
  return `<a class="back" href="#start">← Hospital at Home</a>
  <section><div class="eyebrow">MEDICA 2026</div><h1>${esc(d.short)} <em>× Actimi</em></h1><p class="sub">Hospital at Home</p>
    <p class="lead">Your ${esc(devName(d))}, connected to the care team – from home.</p>
    <div class="cta">${btn}</div></section>
  ${benefits()}
  <section><h2>Set up your device</h2><a class="guide" href="../#${d.id}"><div><strong>${esc(devName(d))} – setup guide</strong><br><span>Video and 6 steps: pairing, measuring, sending readings</span></div></a></section>
  <p class="foot">Demo for MEDICA 2026. Always follow the manufacturer’s instructions for use. Actimi GmbH · <a href="https://actimi.com" style="color:inherit">actimi.com</a></p>`;
}
function render(){
  const d = DATA.devices.find(x => x.id === (location.hash||'').slice(1));
  document.getElementById('view').innerHTML = d ? partner(d) : overview();
  document.title = d ? `${d.short} × Actimi · Hospital at Home` : 'Hospital at Home · Actimi';
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0,0); });
render();
</script>
</body>
</html>
